<header class="cabecalho-app">
  <h1>{{ title() }}</h1>
  <span class="subtitulo">cadastro, listagem e teste de layouts</span>
</header>

<mat-tab-group #tabs animationDuration="0ms" (selectedIndexChange)="aoTrocarAba($event)">
  <mat-tab label="Cadastrar">
    <app-layout-form [layoutParaEditar]="layoutEmEdicao()" (salvo)="aoSalvarLayout()" />
  </mat-tab>
  <mat-tab label="Listar">
    <app-layout-list (editar)="editarLayout($event)" />
  </mat-tab>
  <mat-tab label="Testar">
    <app-layout-test />
  </mat-tab>
</mat-tab-group>
