<div class="layout-list">
  <div class="cabecalho">
    <h2>Layouts cadastrados</h2>
    <button mat-stroked-button type="button" (click)="recarregar()">
      <mat-icon>refresh</mat-icon>
      Atualizar
    </button>
  </div>

  @if (carregando()) {
    <p>Carregando...</p>
  } @else if (layouts().length === 0) {
    <p>Nenhum layout cadastrado ainda.</p>
  } @else {
    <table mat-table [dataSource]="layouts()">
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let layout">{{ layout.codigo }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let layout">{{ layout.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="delimitador">
        <th mat-header-cell *matHeaderCellDef>Delimitador</th>
        <td mat-cell *matCellDef="let layout">{{ layout.delimitador }}</td>
      </ng-container>

      <ng-container matColumnDef="numeroDeCampos">
        <th mat-header-cell *matHeaderCellDef>Nº de campos</th>
        <td mat-cell *matCellDef="let layout">{{ layout.campos.length }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let layout">
          <button mat-icon-button type="button" (click)="onEditar(layout)" aria-label="Editar layout">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" color="warn" (click)="remover(layout)" aria-label="Remover layout">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>
  }
</div>
